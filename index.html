<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小满选题台 · 小学生家长陪读与资源</title>
<style>
:root{
  --rose-25:#FDFAF8;
  --rose-50:#FBF3F0;
  --rose-100:#F7E9E4;
  --rose-200:#F0DBD4;
  --rose-300:#E3C6BE;
  --rose-400:#CFA8A2;
  --rose-500:#B98A86;
  --rose-600:#A5756F;
  --ink:#2B2523;
  --ink-2:#6E6462;
  --ink-3:#9A8F8C;
  --line:#F0E4DF;
  --line-2:#F6EDE9;
  --card:#fff;
  --shadow:0 1px 2px rgba(122,86,74,.04), 0 18px 40px -32px rgba(122,86,74,.55);
  --shadow-lift:0 2px 4px rgba(122,86,74,.05), 0 26px 50px -30px rgba(122,86,74,.45);
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:
    radial-gradient(1100px 620px at 88% -12%, #F7E7E2 0%, rgba(247,231,226,0) 62%),
    radial-gradient(880px 520px at -8% 14%, #FAF0EA 0%, rgba(250,240,234,0) 58%),
    radial-gradient(760px 500px at 60% 108%, #FBF1EC 0%, rgba(251,241,236,0) 60%),
    #FBF7F5;
  min-height:100vh;
  display:flex;
  font-size:14px;
  line-height:1.7;
}
::selection{background:var(--rose-200)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}

/* ---------- sidebar ---------- */
.sidebar{
  width:236px;flex:0 0 236px;
  padding:26px 18px 22px;
  border-right:1px solid rgba(240,228,223,.9);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.42));
  backdrop-filter:blur(14px);
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:18px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 4px}
.mark{
  width:38px;height:38px;border-radius:13px;flex:0 0 38px;
  background:linear-gradient(150deg,#E3C6BE,#C79A94);
  color:#fff;font-family:var(--serif);font-size:19px;
  display:grid;place-items:center;
  box-shadow:0 10px 22px -12px rgba(169,117,111,.9), inset 0 1px 0 rgba(255,255,255,.4);
}
.brand-name{font-family:var(--serif);font-size:15.5px;letter-spacing:.04em}
.brand-sub{font-size:10.5px;color:var(--ink-3);letter-spacing:.16em;margin-top:-1px}
nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  color:var(--ink-2);font-size:13.5px;letter-spacing:.02em;
  transition:.22s;position:relative;
}
.nav-item svg{width:16px;height:16px;opacity:.72;flex:0 0 16px}
.nav-item:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.nav-item.on{
  background:#fff;color:var(--ink);font-weight:600;
  box-shadow:0 1px 2px rgba(122,86,74,.05),0 14px 24px -22px rgba(122,86,74,.9);
}
.nav-item.on svg{opacity:1;color:var(--rose-500)}
.nav-item.on::before{
  content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:0 3px 3px 0;background:var(--rose-400);
}
.nav-badge{
  margin-left:auto;font-size:10.5px;color:var(--rose-600);
  background:var(--rose-50);border:1px solid var(--rose-100);
  padding:0 6px;border-radius:20px;line-height:16px;min-width:19px;text-align:center;
  font-variant-numeric:tabular-nums;
}
.side-card{
  margin-top:auto;background:linear-gradient(165deg,#fff,#FCF4F1);
  border:1px solid var(--line);border-radius:16px;padding:14px;
}
.side-card .k{font-size:10px;letter-spacing:.18em;color:var(--rose-500)}
.side-card .t{font-family:var(--serif);font-size:13.5px;line-height:1.6;margin:6px 0 4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.side-card .d{font-size:11.5px;color:var(--ink-3);line-height:1.6}
.side-foot{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;padding-left:6px}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:30px 40px 70px;max-width:1180px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:26px}
.kicker{font-size:10.5px;letter-spacing:.24em;color:var(--rose-500);font-weight:600}
h1.page{font-family:var(--serif);font-size:27px;line-height:1.35;letter-spacing:.02em;margin:7px 0 5px;font-weight:600}
.page-desc{font-size:12.5px;color:var(--ink-3);max-width:520px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.style-chip{
  display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);
  background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:8px 13px;
}
.style-chip i{width:6px;height:6px;border-radius:50%;background:var(--rose-400);display:block}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:999px;font-size:12.5px;padding:9px 17px;transition:.2s;
  border:1px solid transparent;white-space:nowrap;
}
.btn.primary{
  background:linear-gradient(160deg,#C2938D,#B3857F);color:#fff;
  box-shadow:0 10px 22px -14px rgba(169,117,111,.95), inset 0 1px 0 rgba(255,255,255,.22);
  font-weight:600;letter-spacing:.02em;
}
.btn.primary:hover{background:linear-gradient(160deg,#B98A86,#A87973);transform:translateY(-1px)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--rose-300);color:var(--ink);background:#FFFCFB}
.btn.mini{padding:5px 11px;font-size:11.5px}
.btn.line{background:transparent;border-color:var(--rose-200);color:var(--rose-600)}
.btn.line:hover{background:var(--rose-50)}
.btn:active{transform:translateY(0) scale(.99)}

/* ---------- generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.hoverable{transition:.26s cubic-bezier(.2,.7,.3,1)}
.hoverable:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--rose-200)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:4px 0 14px;flex-wrap:wrap}
.sec-title{font-family:var(--serif);font-size:16px;letter-spacing:.03em;display:flex;align-items:center;gap:9px}
.sec-title::before{content:"";width:14px;height:1px;background:var(--rose-400);display:block}
.sec-sub{font-size:11.5px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.tag{
  display:inline-block;font-size:10.5px;letter-spacing:.04em;color:var(--rose-600);
  background:var(--rose-50);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;
}
.tag.grey{color:var(--ink-2);background:#F8F6F5;border-color:#EFEDEC}
.divider{height:1px;background:var(--line-2);margin:16px 0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- hot ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chip{
  font-size:12px;color:var(--ink-2);border:1px solid var(--line);background:rgba(255,255,255,.72);
  border-radius:999px;padding:6px 13px;transition:.2s;
}
.chip:hover{border-color:var(--rose-300);color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.searchbox{
  display:flex;align-items:center;gap:8px;flex:1;min-width:240px;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 15px;
  transition:.2s;
}
.searchbox:focus-within{border-color:var(--rose-300);box-shadow:0 0 0 4px rgba(227,198,190,.26)}
.searchbox input{flex:1;border:0;outline:0;background:transparent;font-size:12.5px}
.searchbox input::placeholder{color:#BBAFAC}
.status{font-size:11px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
.status i{width:6px;height:6px;border-radius:50%;background:#C9C1BE;display:block}
.status.live i{background:#8FAE93;box-shadow:0 0 0 3px rgba(143,174,147,.16)}
.status.local i{background:#D6B48C}
.status.load i{background:var(--rose-400);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}

.hot-row{display:flex;gap:18px;padding:18px 22px;align-items:flex-start;position:relative;overflow:hidden}
.hot-row + .hot-row{border-top:1px solid var(--line-2)}
.rank{font-family:var(--serif);font-size:26px;line-height:1;color:var(--rose-300);width:34px;flex:0 0 34px;padding-top:4px;font-style:italic}
.hot-row:nth-child(1) .rank{color:var(--rose-500)}
.hot-main{flex:1;min-width:0}
.hot-title{font-family:var(--serif);font-size:15.5px;line-height:1.55;letter-spacing:.01em;font-weight:600}
.hot-sum{font-size:12.5px;color:var(--ink-2);margin-top:5px;line-height:1.65}
.hot-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-3)}
.hot-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:0 0 auto}
.heat{font-family:var(--serif);font-size:17px;color:var(--rose-600);font-style:italic;line-height:1}
.heat small{font-size:9px;font-style:normal;color:var(--ink-3);letter-spacing:.1em;display:block;text-align:right;margin-top:2px}
.match{
  display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-2);
}
.bar{width:44px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--rose-400);border-radius:3px}
.quick-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* search results */
.sr-item{padding:13px 16px;border-radius:14px;border:1px solid var(--line-2);background:#fff;margin-bottom:9px}
.sr-item:hover{border-color:var(--rose-200);background:#FFFCFB}
.sr-t{font-size:13px;font-weight:600;line-height:1.55}
.sr-d{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.65}
.sr-m{font-size:10.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* reference cards */
.ref-card{padding:18px 20px;display:flex;flex-direction:column;gap:9px;height:100%}
.ref-type{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.ref-title{font-family:var(--serif);font-size:14.5px;line-height:1.6;font-weight:600;letter-spacing:.01em}
.ref-stats{display:flex;gap:14px;font-size:11px;color:var(--ink-2);margin-top:2px}
.ref-stats b{font-weight:600;color:var(--ink);font-family:var(--serif);font-size:13px}
.ref-why{font-size:11.5px;color:var(--ink-2);line-height:1.65;border-top:1px dashed var(--line);padding-top:9px;margin-top:auto}

/* teardown */
.td-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.td-list{padding:10px;position:sticky;top:20px}
.td-item{padding:11px 12px;border-radius:12px;cursor:pointer;transition:.2s;border:1px solid transparent}
.td-item:hover{background:#FDF9F7}
.td-item.on{background:var(--rose-50);border-color:var(--rose-200)}
.td-item .tt{font-size:12px;line-height:1.55;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.td-item .ts{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.formula{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.fseg{background:linear-gradient(180deg,#FFF7F4,#FBEDE8);border:1px solid var(--rose-200);border-radius:8px;padding:7px 11px;font-size:12.5px;font-family:var(--serif);position:relative}
.fseg b{display:block;font-size:9.5px;color:var(--rose-500);font-weight:600;letter-spacing:.08em;font-family:var(--sans);margin-top:2px}
.plus{color:var(--rose-300);font-size:12px}
.spine{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.spine li{list-style:none;position:relative;padding-left:30px;font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.spine li::before{
  counter-increment:s;content:counter(s,decimal-leading-zero);
  position:absolute;left:0;top:1px;font-family:var(--serif);font-size:11px;color:var(--rose-500);
  background:var(--rose-50);border:1px solid var(--line);border-radius:6px;width:22px;height:20px;
  display:grid;place-items:center;
}
.quote{
  font-family:var(--serif);font-size:13px;line-height:1.8;color:var(--ink);
  padding:11px 14px;border-left:2px solid var(--rose-300);background:#FDF8F6;border-radius:0 10px 10px 0;
  margin-bottom:8px;
}
.copyline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;background:#FDFAF9;border:1px solid var(--line-2);margin-bottom:8px;font-size:12.5px;line-height:1.6}
.copyline:hover{background:#FFFCFB;border-color:var(--rose-200)}

/* topic cards */
.topic-card{padding:0;overflow:hidden;display:flex;flex-direction:column;height:100%}
.topic-cover{
  padding:20px 20px 16px;background:linear-gradient(160deg,#FBF1ED,#FDF9F7 70%);
  border-bottom:1px solid var(--line-2);position:relative;
}
.topic-cover .idx{font-family:var(--serif);font-style:italic;font-size:11px;color:var(--rose-500);letter-spacing:.16em}
.topic-title{font-family:var(--serif);font-size:15.5px;line-height:1.62;font-weight:600;margin-top:8px;letter-spacing:.01em}
.topic-sub{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.6}
.topic-body{padding:16px 20px 18px;display:flex;flex-direction:column;gap:11px;flex:1}
.kv{display:flex;gap:8px;font-size:11.5px;line-height:1.65}
.kv .k{color:var(--ink-3);flex:0 0 46px;letter-spacing:.04em}
.kv .v{color:var(--ink-2);flex:1}
.topic-foot{display:flex;gap:7px;padding:0 20px 18px;flex-wrap:wrap}
.topic-out{border-top:1px dashed var(--line);padding-top:9px;display:flex;flex-direction:column;gap:5px;margin-top:2px}
.topic-out div{font-size:11px;line-height:1.6;color:var(--ink-3);display:flex;gap:7px}
.topic-out div span{color:var(--rose-500);font-family:var(--serif);font-style:italic;flex:0 0 12px}
.empty{
  text-align:center;padding:56px 20px;border:1px dashed var(--rose-200);border-radius:20px;background:rgba(255,255,255,.6);
}
.empty .il{font-family:var(--serif);font-size:32px;color:var(--rose-300);font-style:italic}
.empty h3{font-family:var(--serif);font-size:16px;margin:10px 0 6px;font-weight:600}
.empty p{font-size:12px;color:var(--ink-3);max-width:340px;margin:0 auto 16px}

/* account */
.profile-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3)}
.field input,.field textarea{
  border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;background:#FDFBF9;outline:0;transition:.2s;resize:vertical;
}
.field input:focus,.field textarea:focus{border-color:var(--rose-300);background:#fff;box-shadow:0 0 0 3px rgba(227,198,190,.24)}
.mix-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.mix-row .mk{font-size:12px;width:64px;flex:0 0 64px;color:var(--ink-2)}
.mix-track{flex:1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.mix-track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#E0C0B9,#C79A94)}
.mix-row .mv{font-size:11px;color:var(--ink-3);width:30px;text-align:right;font-variant-numeric:tabular-nums}
.mix-row input[type=range]{
  width:74px;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;
  background:var(--rose-200);outline:0;
}
.mix-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;
  border:1.5px solid var(--rose-500);box-shadow:0 1px 3px rgba(140,96,86,.35);cursor:pointer;
}
.mix-row input[type=range]::-moz-range-thumb{
  width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid var(--rose-500);cursor:pointer;
}

.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{border:1px solid var(--line-2);border-radius:13px;padding:10px;min-height:112px;background:#FDFBF9;display:flex;flex-direction:column;gap:7px}
.day .dn{font-size:10px;color:var(--ink-3);letter-spacing:.08em;text-align:center}
.day .dn b{display:block;font-family:var(--serif);font-size:14px;color:var(--ink);font-weight:600;letter-spacing:0}
.slot{font-size:10.5px;line-height:1.5;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 7px;color:var(--ink-2);position:relative}
.slot b{display:block;font-size:9.5px;color:var(--rose-500);font-weight:600;margin-bottom:2px}
.slot .x{position:absolute;top:2px;right:4px;font-size:10px;color:#C0B4B1;opacity:0;transition:.2s}
.slot:hover .x{opacity:1}
.day .add{font-size:10.5px;color:#C6BAB7;border:1px dashed var(--line);border-radius:8px;padding:5px;text-align:center;margin-top:auto}
.day .add:hover{color:var(--rose-500);border-color:var(--rose-200);background:#fff}

.res-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line-2);font-size:12px;align-items:center}
.res-item:last-child{border-bottom:0}
.res-item .rn{font-weight:600;font-size:12.5px}
.res-item .rd{font-size:11px;color:var(--ink-3);margin-top:2px}

.stat{display:flex;flex-direction:column;gap:2px}
.stat .sv{font-family:var(--serif);font-size:22px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.stat .sl{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.stat .sd{font-size:10.5px;color:#8FAE93}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);vertical-align:middle}
tbody tr:hover{background:#FDFAF9}
td.t{color:var(--ink);font-size:12.5px;max-width:320px}
td.n{font-variant-numeric:tabular-nums;color:var(--ink)}
.rate{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--rose-50);color:var(--rose-600);font-variant-numeric:tabular-nums}

.insight{padding:14px 16px;border-radius:14px;background:linear-gradient(160deg,#FFFCFB,#FCF2EE);border:1px solid var(--line)}
.insight .ik{font-size:10px;letter-spacing:.16em;color:var(--rose-500);font-weight:600}
.insight .it{font-size:12.5px;line-height:1.7;margin-top:5px;color:var(--ink-2)}
.insight .it b{color:var(--ink)}

/* poster preview */
.poster{
  width:210px;aspect-ratio:3/4;border-radius:16px;padding:18px 16px;
  background:linear-gradient(165deg,#F4E1DB 0%,#EBD2CB 52%,#F8EEE9 100%);
  box-shadow:0 22px 40px -26px rgba(140,96,86,.85), inset 0 1px 0 rgba(255,255,255,.5);
  display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.poster::after{content:"";position:absolute;right:-40px;bottom:-50px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.28)}
.poster-k{font-size:8.5px;letter-spacing:.2em;color:#9E7E77}
.poster-t{font-family:var(--serif);font-size:25px;line-height:1.35;color:#4A3A37;letter-spacing:.01em;font-weight:600}
.poster-s{font-size:10px;line-height:1.7;color:#8A6F69;margin-top:8px}

const $ = s=>document.querySelector(s);
function toast(msg){
  $('#toastText').textContent = msg;
  const t=$('#toast'); t.classList.add('on');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('on'),1900);
}
function copy(text){
  const done=()=>toast('已复制');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

      S.search.status='live'; S.search.note='已连接公开热榜接口，已按教育相关度筛选';
      renderSearchArea(); return;
    }
  }
  S.search.results=local.length?local:cachedFor(q);
  S.search.status='local';
  S.search.note='未取到实时数据（可能离线或接口限流），以下为本地点子库匹配结果';
  renderSearchArea();
}

  return /教育|小学|孩子|家长|作业|学校|老师|考试|升学|辅导|培训|教材|双减|中考|高考|儿童|学生/.test(t);
}
function localSearch(q){
  const key=q.toLowerCase();
  const hitHot = HOT.filter(h=> (h.title+h.summary+h.keywords.join('')+h.tags.join('')).toLowerCase().includes(key));
  const hitRef = REFS.filter(r=> (r.title+r.type+r.why+r.template).toLowerCase().includes(key));
  const allBp=[...BLUEPRINTS.h,...BLUEPRINTS.m,...BLUEPRINTS.r];
  const hitBp = allBp.filter(b=> (b.title+b.tags.join('')+b.outline.join('')).toLowerCase().includes(key));
  const out=[
    ...hitHot.map(h=>({title:h.title, desc:h.summary, source:h.source, date:h.date, kind:'本地热点', hotId:h.id})),
    ...hitBp.slice(0,3).map(b=>({title:b.title, desc:(b.sub||'')+'　｜　'+b.hook, source:'我的选题库', date:'', kind:'选题模板'})),
    ...hitRef.map(r=>({title:r.title, desc:r.why, source:'爆款样本 · '+r.account, date:'', kind:'参考样本', refId:r.id}))
  ];
  if(!out.length) return cachedFor(q);
  return out.slice(0,10);
}
function cachedFor(q){
  const k=q.replace(/\s+/g,'');
  return [
    {title:`${k}：家长最常见的 3 个误区`, desc:`围绕「${k}」的通用切口，适合做“纠偏型”贴图：先说错在哪，再给替代动作。`, source:'本地点子库', date:'', kind:'兜底建议'},
    {title:`${k}：我家的做法（真实记录版）`, desc:`真实记录型内容，完读率高。结构：时间线 + 具体数字 + 一句复盘。`, source:'本地点子库', date:'', kind:'兜底建议'},
    {title:`${k}：一份可直接打印的清单`, desc:`资源承接型内容，收藏率高。把方法做成一页 A4，评论区领。`, source:'本地点子库', date:'', kind:'兜底建议'}
  ];
}
async function fetchLive(){
  for(const api of HOTS_API){
    try{
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(), 4200);
      const res=await fetch(api.url,{signal:ctrl.signal, headers:{'Accept':'application/json'}});
      clearTimeout(timer);
      if(!res.ok) continue;
      const j=await res.json();
      const arr = j.data || j.list || j.result || [];
      if(Array.isArray(arr) && arr.length){
        return arr.slice(0,30).map(x=>({
          title: (x.title||x.name||x.word||'').toString().trim(),
          source: api.name
        })).filter(x=>x.title);
      }
    }catch(e){ /* 下一个 */ }
  }
  return [];
}

function generate(jump){
  const rot = S.rot||0;
  const hotPick = BLUEPRINTS.h[rot % BLUEPRINTS.h.length];
  const mPick = BLUEPRINTS.m[rot % BLUEPRINTS.m.length];
  const rPick = BLUEPRINTS.r[rot % BLUEPRINTS.r.length];
  const mk = (b,type)=>({...b, id:uid(), type:b.type||type});
  const picks=[mk(hotPick,'热点借势'), mk(mPick,'方法干货'), mk(rPick,'资源清单')];
  const existed = new Set(S.topics.map(x=>x.title));
  const fresh = picks.filter(p=>!existed.has(p.title));
  const chosen = (fresh.length>=3?fresh.slice(0,3):[...fresh,...picks.filter(p=>!fresh.includes(p))].slice(0,3));
  S.topics = [...chosen, ...S.topics].slice(0,12);
  S.rot = rot+1;
  if(jump) S.tab='topics';
  save(); render();
  toast('已生成 3 个选题：热点 1 · 干货 1 · 资源 1');
}

      <div class="field"><label>一句话人设</label>
        <input value="${esc(a.persona)}" oninput="upd('persona',this.value)"></div>
      <div class="field"><label>目标读者</label>
        <textarea rows="2" oninput="upd('audience',this.value)">${esc(a.audience)}</textarea></div>
      <div class="field"><label>风格关键词</label>
        <input value="${esc(a.keywords)}" oninput="upd('keywords',this.value)"></div>
      <div class="field" style="margin-bottom:0"><label>语气底线</label>
        <input value="${esc(a.tone)}" oninput="upd('tone',this.value)"></div>
    </div>

    <div>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="sec-head" style="margin-bottom:14px">
          <div class="sec-title">账号健康度</div>
        </div>
        <div class="grid g2" style="gap:14px">
          <div class="stat"><span class="sv num">${a.followers.toLocaleString()}</span><span class="sl">总关注</span><span class="sd">本周 +${a.weekNew}</span></div>
          <div class="stat"><span class="sv num">${a.openRate}</span><span class="sl">首图点击率</span><span class="sd">高于同类 6pt</span></div>
          <div class="stat"><span class="sv num">${a.shareRate}</span><span class="sl">转发率</span><span class="sd">资源类拉动</span></div>
          <div class="stat"><span class="sv num">3</span><span class="sl">本周已排</span><span class="sl" style="color:var(--ink-3)">目标 3 篇</span></div>
        </div>
      </div>
      <div class="card card-pad">
        <div class="sec-head" style="margin-bottom:12px"><div class="sec-title">内容配比</div>
          <div class="sec-sub">拖一下就行</div></div>
        ${S.mix.map((m,i)=>`
          <div class="mix-row">
            <span class="mk">${m.k}</span>
            <span class="mix-track"><i style="width:${Math.min(100,m.v*2)}%"></i></span>
            <input type="range" min="0" max="50" value="${m.v}" oninput="setMix(${i},this.value)">
            <span class="mv num">${m.v}%</span>
          </div>`).join('')}
      </div>
    </div>
  </div>

  <div class="card card-pad" style="margin-top:16px">
    <div class="sec-head">
      <div class="sec-title">本周排期</div>
      <div class="sec-sub">从选题卡片点“加入排期”就会落到这里</div>
    </div>
    <div class="sched">
      ${DAYS.map(d=>{
        const items=(S.sched[d]||[]);
        return `<div class="day">
          <div class="dn"><b>${d}</b></div>
          ${items.map((it,i)=>`<div class="slot"><b>${it.time} · ${esc(it.type)}</b>${esc(it.title)}
            <span class="x" onclick="delSched('${d}',${i})">✕</span></div>`).join('')}
          ${items.length<2?`<div class="add" onclick="toTopics()">＋ 选题</div>`:''}
        </div>`;
      }).join('')}
    </div>
  </div>

  <div class="grid g2" style="margin-top:16px;align-items:start">
    <div class="card card-pad">
      <div class="sec-head" style="margin-bottom:10px"><div class="sec-title">资源库（你的护城河）</div>
        <div class="sec-sub">后台回复关键词领取</div></div>
      ${[
        ['陪读分工表','A4 打印版 · 按“可拒绝”三色标注','1,240'],
        ['读题三步法练习纸','20 题 · 1–3 年级','860'],
        ['0 元入学准备清单','幼小衔接 · 六页','1,530'],
        ['三色错题模板','3–6 年级 · 可直接打印','690'],
        ['考前 7 天复习表','11 月版 · 含作息栏','420']
      ].map(([n,d,c])=>`<div class="res-item">
        <div><div class="rn">${n}</div><div class="rd">${d}</div></div>
        <div style="text-align:right"><div class="num" style="font-size:13px;color:var(--ink)">${c}</div>
        <div class="muted" style="font-size:10px">次下载</div></div>
      </div>`).join('')}
    </div>
    <div class="card card-pad">
      <div class="sec-head" style="margin-bottom:10px"><div class="sec-title">选题库（已收藏）</div>
        <div class="sec-sub">${S.topics.length} 条</div></div>
      ${S.topics.length?S.topics.slice(0,6).map(t=>`
        <div class="res-item">
          <div><div class="rn" style="font-weight:500;font-size:12px">${esc(t.title)}</div>
            <div class="rd">${esc(t.type)} · ${esc(t.time)}</div></div>
          <button class="btn ghost mini" onclick="scheduleItem('${t.id}')">排期</button>
        </div>`).join(''):`<div class="muted" style="font-size:12px;padding:14px 0">还没有选题，去“今日选题”生成一批。</div>`}
    </div>
  </div>`;
}
function upd(k,v){ S.account[k]=v; save(); }
function setMix(i,v){
  S.mix[i].v=parseInt(v,10); save();
  const rows=document.querySelectorAll('.mix-row');
  if(rows[i]){
    rows[i].querySelector('.mix-track i').style.width=Math.min(100,S.mix[i].v*2)+'%';
    rows[i].querySelector('.mv').textContent=S.mix[i].v+'%';
  }
}
function toTopics(){ go('topics'); }
function scheduleItem(id){
  initSched();
  const t=S.topics.find(x=>x.id===id); if(!t) return;
  const order=['周一','周三','周五','周二','周四','周六','周日'];
  const day=order.find(d=>(S.sched[d]||[]).length<2) || '周一';
  S.sched[day]=S.sched[day]||[];
  S.sched[day].push({time:'20:30', type:t.type, title:t.title});
  S.tab='account'; save(); render();
  toast('已排到 '+day+' 20:30');
}
function delSched(d,i){ S.sched[d].splice(i,1); save(); render(); }

/* ==========================================================
   06 数据复盘
   ========================================================== */
let dataRange='7';
function viewData(){
  const posts=[...POSTS7].reverse();
  const total=POSTS7.reduce((s,p)=>s+p.read,0);
  const avg=Math.round(total/POSTS7.length);
  const shareRate=(POSTS7.reduce((s,p)=>s+p.share,0)/total*100).toFixed(1);
  const favRate=(POSTS7.reduce((s,p)=>s+p.fav,0)/total*100).toFixed(1);
  const byType={};
  POSTS7.forEach(p=>{
    byType[p.type]=byType[p.type]||{n:0,read:0,share:0,fav:0};
    byType[p.type].n++; byType[p.type].read+=p.read;
    byType[p.type].share+=p.share; byType[p.type].fav+=p.fav;
  });
  const types=Object.keys(byType);
  const bestType=types.sort((a,b)=>(byType[b].read/byType[b].n)-(byType[a].read/byType[a].n))[0];
  const maxAvg=Math.max(...types.map(t=>byType[t].read/byType[t].n))||1;
  const best=POSTS7.reduce((a,b)=>a.read>b.read?a:b);

  return `
  <div class="grid g4" style="margin-bottom:18px">
    <div class="card card-pad stat"><span class="sv num">${fmt(total)}</span><span class="sl">近 7 篇总阅读</span><span class="sd">较上周 +18%</span></div>
    <div class="card card-pad stat"><span class="sv num">${fmt(avg)}</span><span class="sl">篇均阅读</span><span class="sd">高于账号均值</span></div>
    <div class="card card-pad stat"><span class="sv num">${shareRate}%</span><span class="sl">整体转发率</span><span class="sd">资源类最高</span></div>
    <div class="card card-pad stat"><span class="sv num">${favRate}%</span><span class="sl">收藏率</span><span class="sd">工具型拉动</span></div>
  </div>

  <div class="card card-pad" style="margin-bottom:18px">
    <div class="sec-head">
      <div class="sec-title">${dataRange==='7'?'近 7 篇阅读走势':'近 4 周阅读走势'}</div>
      <div style="display:flex;gap:6px">
        <button class="chip ${dataRange==='7'?'on':''}" onclick="setRange('7')">近 7 篇</button>
        <button class="chip ${dataRange==='30'?'on':''}" onclick="setRange('30')">近 4 周</button>
      </div>
    </div>
    ${dataRange==='7'?chart(posts,'read'):chart4()}
  </div>

  <div class="grid g2" style="align-items:start">
    <div class="card card-pad">
      <div class="sec-head" style="margin-bottom:8px"><div class="sec-title">逐篇明细</div>
        <div class="sec-sub">示例数据 · 换成你自己的后台导出即可</div></div>
      <table>
        <thead><tr><th>标题</th><th>类型</th><th style="text-align:right">阅读</th><th style="text-align:right">转发率</th></tr></thead>
        <tbody>
        ${POSTS7.map(p=>`<tr>
          <td class="t">${esc(p.t)}</td>
          <td><span class="tag grey">${p.type}</span></td>
          <td class="n" style="text-align:right">${p.read.toLocaleString()}</td>
          <td style="text-align:right"><span class="rate">${(p.share/p.read*100).toFixed(2)}%</span></td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div>
      <div class="card card-pad" style="margin-bottom:16px">
        <div class="sec-head" style="margin-bottom:10px"><div class="sec-title">类型效率</div></div>
        ${types.map(t=>{
          const v=byType[t]; const sr=(v.share/v.read*100).toFixed(2);
          return `<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
              <span>${t} <span class="muted" style="font-size:10.5px">${v.n} 篇</span></span>
              <span class="num" style="color:var(--ink-2)">篇均 ${fmt(Math.round(v.read/v.n))} · 转发 ${sr}%</span>
            </div>
            <div class="bar" style="width:100%;height:5px"><i style="width:${Math.round((v.read/v.n)/maxAvg*100)}%;background:linear-gradient(90deg,#E3C6BE,#C2948E)"></i></div>
          </div>`;
        }).join('')}
      </div>
      <div class="grid" style="gap:12px">
        ${insightBox('本周结论',`<b>${bestType}</b> 的篇均阅读最高；资源清单的收藏率是平均值的 2.3 倍——你的读者在用“收藏”投票。`)}
        ${insightBox('下一篇怎么调',`把《${esc(best.t)}》的结构复用一次：<b>具体工具 + 前后对比 + 可领取</b>，标题里的数字保留。`)}
        ${insightBox('需要警惕','热点借势类的阅读波动最大（6k–19k），不要连续两篇都押热点，容易掉粉。')}
      </div>
    </div>
  </div>`;
}
function setRange(r){ dataRange=r; render(); }

function chart(posts){
  const W=720,H=248,pad={l:44,r:16,t:22,b:60};
  const max=Math.max(...posts.map(p=>p.read))*1.15;
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const bw=iw/posts.length*0.46;
  const step=iw/posts.length;
  const y=v=>pad.t+ih-(v/max)*ih;
  const bars=posts.map((p,i)=>{
    const x=pad.l+step*i+(step-bw)/2;
    const h=(p.read/max)*ih;
    return `<g>
      <rect x="${x}" y="${y(p.read)}" width="${bw}" height="${h}" rx="5" fill="url(#g1)" opacity=".92"/>
      <text x="${x+bw/2}" y="${y(p.read)-8}" font-size="10" fill="#A5756F" text-anchor="middle" font-family="Georgia,serif">${(p.read/1000).toFixed(1)}k</text>
      <text x="${x+bw/2}" y="${H-pad.b+18}" font-size="9.5" fill="#A99C98" text-anchor="middle">${p.date}</text>
      <text x="${x+bw/2}" y="${H-pad.b+32}" font-size="9" fill="#C6BAB7" text-anchor="middle">${p.type.slice(0,2)}</text>
      <text x="${x+bw/2}" y="${H-pad.b+46}" font-size="9" fill="#B98A86" text-anchor="middle">${(p.share/p.read*100).toFixed(1)}%</text>
    </g>`;
  }).join('');
  const grids=[0,.25,.5,.75,1].map(g=>{
    const yy=pad.t+ih*g;
    return `<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#F3EAE6" stroke-width="1"/>
      <text x="${pad.l-8}" y="${yy+3}" font-size="9" fill="#C6BAB7" text-anchor="end">${Math.round(max*(1-g)/1000)}k</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCB6AF"/><stop offset="100%" stop-color="#F3E2DD"/>
    </linearGradient></defs>
    ${grids}${bars}
    <text x="${pad.l}" y="12" font-size="9.5" fill="#A99C98">阅读量</text>
    <text x="${W-pad.r}" y="12" font-size="9.5" fill="#C6BAB7" text-anchor="end">底部百分比 = 转发率</text>
  </svg>`;
}
function chart4(){
  const W=720,H=230,pad={l:44,r:16,t:20,b:42};
  const max=Math.max(...WEEKS.map(w=>w.read))*1.15;
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const bw=iw/WEEKS.length*0.34;
  const step=iw/WEEKS.length;
  const y=v=>pad.t+ih-(v/max)*ih;
  const bars=WEEKS.map((w,i)=>{
    const x=pad.l+step*i+(step-bw)/2;
    return `<g>
      <rect x="${x}" y="${y(w.read)}" width="${bw}" height="${(w.read/max)*ih}" rx="6" fill="url(#g2)"/>
      <text x="${x+bw/2}" y="${y(w.read)-8}" font-size="10.5" fill="#A5756F" text-anchor="middle" font-family="Georgia,serif">${(w.read/1000).toFixed(1)}k</text>
      <text x="${x+bw/2}" y="${H-pad.b+18}" font-size="10" fill="#A99C98" text-anchor="middle">${w.label.replace('\n',' ')}</text>
      <text x="${x+bw/2}" y="${H-pad.b+32}" font-size="9" fill="#C6BAB7" text-anchor="middle">+${w.fans} 关注</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCB6AF"/><stop offset="100%" stop-color="#F5E6E1"/>
    </linearGradient></defs>
    <line x1="${pad.l}" y1="${pad.t+ih}" x2="${W-pad.r}" y2="${pad.t+ih}" stroke="#EFE6E1"/>
    ${bars}
  </svg>
  <div class="muted" style="font-size:11px;margin-top:6px">W3 出现峰值，对应“免费网站”资源篇；W4 回落是热点篇排期偏晚导致。</div>`;
}

/* ==========================================================
   弹窗
   ========================================================== */
function openModal(html){
  $('#modalCard').innerHTML=html;
  $('#modal').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeModal(){
  $('#modal').classList.remove('on');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

/* ==========================================================
   启动
   ========================================================== */
(function initTab(){
  try{
    const h=(location.hash||'').slice(1);
    if(h && TABS.some(t=>t.id===h)) S.tab=h;
  }catch(e){}
})();
render();
</script>
